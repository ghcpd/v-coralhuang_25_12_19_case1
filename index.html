<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recruitment Dashboard (Base)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Recruitment Dashboard (Base)</h1>
  <div class="muted">Single-file demo: import Excel → list/report → match → update status (with audit table stored in SQLite).</div>

  <div class="card">
    <div class="row">
      <div>
        <label>Import Excel (must contain sheets: JDs, Candidates)</label>
        <input type="file" id="excelFile" accept=".xlsx"/>
      </div>
      <button class="primary" onclick="importExcel()">Import</button>
      <span id="importResult" class="muted"></span>
    </div>
  </div>

  <!-- Bug: 搜索框没有防抖功能 -->
  <div class="card">
    <div class="row">
      <input id="searchBox" placeholder="Search by name, email, or skills..." style="flex:1"/>
      <select id="sortBy">
        <option value="">Sort by...</option>
        <option value="date_asc">Submission Date (Old First)</option>
        <option value="date_desc">Submission Date (New First)</option>
        <option value="status">Status</option>
        <option value="id">Candidate ID</option>
      </select>
      <button class="primary" onclick="loadCandidates()">Apply Filters</button>
    </div>
  </div>

  <div class="card grid2">
    <div>
      <div class="row">
        <div>
          <label>Filter by JD_ID (optional)</label>
          <input id="jdFilter" placeholder="e.g. JD-1001"/>
        </div>
        <button class="primary" onclick="loadCandidates()">Load Candidates</button>
      </div>
      <!-- Bug: 批量操作 UI 但后端支持不完整 -->
      <div class="row" style="margin-bottom: 10px">
        <button class="secondary" onclick="selectAll()">Select All</button>
        <button class="secondary" onclick="deselectAll()">Deselect All</button>
        <button class="primary" onclick="bulkUpdate()">Bulk Update Selected</button>
        <span id="selectedCount" class="muted">0 selected</span>
      </div>
      
      <table id="candTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"/></th>
            <th>Candidate</th>
            <th>JD</th>
            <th>Submission</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      
      <!-- Bug: 分页控制但没有实现 -->
      <div class="row" style="margin-top: 10px">
        <button onclick="prevPage()">← Previous</button>
        <span id="pageInfo" class="muted">Page 1 of 1</span>
        <button onclick="nextPage()">Next →</button>
        <select id="pageSize">
          <option value="10">10 per page</option>
          <option value="25">25 per page</option>
          <option value="50">50 per page</option>
        </select>
      </div>
    </div>

    <div>
      <div class="row">
        <div>
          <label>Report for JD_ID (optional)</label>
          <input id="jdReport" placeholder="e.g. JD-1001"/>
        </div>
        <button class="primary" onclick="loadReport()">Load Report</button>
        <div id="reportMeta" class="muted" style="margin-left:8px"></div>
      </div>

      <div id="reportBox" class="reportBox">
        <div id="statusSummary"></div>
        <div id="submissionTrend" class="muted" style="margin-top:8px;font-size:13px"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Update Status</label>
        <input id="updCandidate" placeholder="Candidate_ID e.g. C-0001"/>
      </div>
      <div>
        <label>Status</label>
        <select id="updStatus">
          <option>Submitted</option>
          <option>Interviewing</option>
          <option>Rejected</option>
          <option>Accepted</option>
        </select>
      </div>
      <div style="flex:1;min-width:280px">
        <label>Reason (only for Rejected)</label>
        <input id="updReason" placeholder="e.g. Not a fit"/>
      </div>
      <button class="primary" onclick="updateStatus()">Update</button>
      <span id="updSpinner" style="display:none;margin-left:8px">⏳</span>
      <span id="updResult" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Match Candidate</label>
        <input id="matchCandidate" placeholder="Candidate_ID e.g. C-0001"/>
      </div>
      <button class="primary" onclick="doMatch()">Match</button>
      <div id="matchMsg" class="muted" style="margin-left:8px"></div>
    </div>
    <div id="matchBox" class="matchBox muted" style="padding:12px">No match selected.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
