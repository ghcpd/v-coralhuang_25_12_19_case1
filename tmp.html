<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recruitment Dashboard (Base)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Recruitment Dashboard (Base)</h1>
  <div class="muted">Single-file demo: import Excel → list/report → match → update status (with audit table stored in SQLite).</div>

  <div class="card">
    <div class="row" style="align-items:center;">
      <div style="flex:1;min-width:240px">
        <label>Import Excel (must contain sheets: JDs, Candidates)</label>
        <input type="file" id="excelFile" accept=".xlsx"/>
      </div>
      <div class="btnGroup">
        <button class="primary" id="importButton" onclick="importExcel()">Import</button>
        <button onclick="checkAutoImport()">Refresh Status</button>
      </div>
      <span id="importResult" class="muted"></span>
    </div>
  </div>

  <!-- Bug: 搜索框没有防抖功能 -->
  <div class="card">
    <div class="row" style="align-items:center">
      <input id="searchBox" placeholder="Search by name, email, or skills..." style="flex:1"/>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="sortBy">
          <option value="">Sort by...</option>
          <option value="date_asc">Submission Date (Old First)</option>
          <option value="date_desc">Submission Date (New First)</option>
          <option value="status">Status</option>
          <option value="id">Candidate ID</option>
        </select>
        <button id="searchButton" onclick="loadCandidates()" class="secondary">Search</button>
        <div id="searchSpinner" class="spinner" style="display:none"></div>
      </div>
    </div>
    <div id="searchError" class="error" style="display:none"></div>
  </div>

  <div class="card grid2">
    <div>
      <div class="row">
        <div>
          <label>Filter by JD_ID (optional)</label>
          <input id="jdFilter" placeholder="e.g. JD-1001"/>
        </div>
        <button onclick="loadCandidates()">Load Candidates</button>
      </div>
      <!-- Bug: 批量操作 UI 但后端支持不完整 -->
      <div class="row" style="margin-bottom: 10px;align-items:center">
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="selectAll()" class="secondary">Select All</button>
          <button onclick="deselectAll()" class="secondary">Deselect All</button>
          <span id="selectedCount" class="muted">0 selected</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <select id="bulkStatus">
            <option value="">Bulk status...</option>
            <option>Submitted</option>
            <option>Interviewing</option>
            <option>Rejected</option>
            <option>Accepted</option>
          </select>
          <input id="bulkReason" placeholder="Reason (only for Rejected)" />
          <button id="bulkApply" class="primary" onclick="bulkUpdate()">Apply to Selected</button>
          <div id="bulkSpinner" class="spinner" style="display:none"></div>
        </div>
      </div>
      
      <table id="candTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"/></th>
            <th>Candidate</th>
            <th>JD</th>
            <th>Submission</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      
      <div class="row" style="margin-top: 10px;align-items:center">
        <div>
          <button onclick="prevPage()">← Previous</button>
          <button onclick="nextPage()">Next →</button>
        </div>
        <div id="pageInfo" class="muted" style="margin-left:8px">Page 1 of 1</div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <select id="pageSize">
            <option value="10">10 per page</option>
            <option value="25">25 per page</option>
            <option value="50">50 per page</option>
          </select>
        </div>
      </div>
    </div>

    <div>
      <div class="row">
        <div>
          <label>Report for JD_ID (optional)</label>
          <input id="jdReport" placeholder="e.g. JD-1001"/>
        </div>
        <button class="secondary" onclick="loadReport()">Load Report</button>
      </div>
      <div id="reportCharts" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Update Status</label>
        <input id="updCandidate" placeholder="Candidate_ID e.g. C-0001"/>
      </div>
      <div>
        <label>Status</label>
        <select id="updStatus">
          <option>Submitted</option>
          <option>Interviewing</option>
          <option>Rejected</option>
          <option>Accepted</option>
        </select>
      </div>
      <div style="flex:1;min-width:280px">
        <label>Reason (only for Rejected)</label>
        <input id="updReason" placeholder="e.g. Not a fit"/>
      </div>
      <button id="updateButton" class="primary" onclick="updateStatus()">Update</button>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="updSpinner" class="spinner" style="display:none"></div>
        <span id="updResult" class="muted"></span>
      </div>
    </div>
    <div id="updateError" class="error" style="display:none"></div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Match Candidate</label>
        <input id="matchCandidate" placeholder="Candidate_ID e.g. C-0001"/>
      </div>
      <button class="secondary" onclick="doMatch()">Match</button>
    </div>
    <div id="matchBox" class="matchCard" style="margin-top:10px"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
